services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  producer:
    image: scalablesystems/flink:2.3.0-scalafree
    depends_on: [kafka]
    volumes:
      - ./data:/data:ro
    environment:
      INPUT: ${TICKS_INPUT:-/data/mock}
      SPEED: ${SPEED:-1000}
      MAX_GAP_S: ${MAX_GAP_S:-60}
      LOOP: ${LOOP:-true}
      PARTITIONS: ${PARTITIONS:-12}
    command: java -cp /jobs/scalable-systems-0.1.0.jar tick.TickPublisher

  jobmanager:
    build:
      context: ./scala
      dockerfile: docker/Dockerfile
    image: scalablesystems/flink:2.3.0-scalafree
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  taskmanager:
    image: scalablesystems/flink:2.3.0-scalafree
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4

  submit:
    image: scalablesystems/flink:2.3.0-scalafree
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka:
        condition: service_started
    command: bash -c "until flink list -m jobmanager:8081 >/dev/null 2>&1; do sleep 2; done && flink run -m jobmanager:8081 -p 4 -c tick.EmaJob /jobs/scalable-systems-0.1.0.jar"

  server:
    build: ./server
    ports:
      - "3001:3001"
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SPEED: ${SPEED:-1000}

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on: [server]
    environment:
      API_URL: http://server:3001
