services:
  kafka:
    # KRaft mode: broker + controller in one process, no ZooKeeper.
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The job's output topics ('ema-results', 'advisories') are auto-created
      # on first write; give them the same 3 partitions as 'ticks'.
      KAFKA_NUM_PARTITIONS: 3

  # Scala producer: replays the mock CSVs into the 'ticks' topic forever.
  producer:
    image: scalablesystems/flink:2.3.0-scalafree
    depends_on:
      - kafka
    volumes:
      - ./data/mock:/mock_data:ro
    command: ["java", "-cp", "/jobs/scalable-systems-0.1.0.jar", "tick.TickPublisher"]

  jobmanager:
    # Multi-stage build: an sbt stage assembles the fat JAR, the runtime stage
    # is stock Flink minus flink-scala_2.12 with the JAR baked in at /jobs.
    build:
      context: ./scala
      dockerfile: docker/Dockerfile
    image: scalablesystems/flink:2.3.0-scalafree
    command: jobmanager
    ports:
      - "8081:8081" # web dashboard + REST submission
    volumes:
      - ./data/full:/data:ro
      - ./data/mock:/mock_data:ro
      - ./output:/out
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        parallelism.default: 1
        rest.flamegraph.enabled: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  taskmanager:
    # Same image as the jobmanager, which owns the `build:`.
    image: scalablesystems/flink:2.3.0-scalafree
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ./data/full:/data:ro
      - ./data/mock:/mock_data:ro
      - ./output:/out
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4

  # One-shot: waits for the cluster, then submits the baked-in JAR so
  # `docker compose up --build` needs no manual submission step.
  submit:
    image: scalablesystems/flink:2.3.0-scalafree
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka:
        condition: service_started
      producer:
        condition: service_started
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    command:
      - bash
      - -c
      - |
        until flink list >/dev/null 2>&1; do sleep 2; done
        flink run -p 4 -c tick.EmaJob /jobs/scalable-systems-0.1.0.jar
    restart: "no"

  server:
    build: ./server
    ports:
      - "3001:3001"
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # Inside the compose network the API is reachable as the "server" service.
      - API_URL=http://server:3001
    depends_on:
      - server
